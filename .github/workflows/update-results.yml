# Runs the analysis on GitHub's computers, so the project keeps itself
# up to date: every weekday evening it downloads the newest prices, re-runs
# the event study, and commits the refreshed tables, charts, and README.
#
# You can also start it by hand: Actions tab -> "Update results" -> Run workflow.

name: Update results

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "tests/**"
      - "config.py"
      - "run_analysis.py"
      - "requirements.txt"
      - ".github/workflows/update-results.yml"
  schedule:
    - cron: "17 22 * * 1-5" # weekdays, after the US market closes

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install packages
        run: pip install -r requirements.txt pytest

      - name: Run tests
        run: python -m pytest tests -q

      - name: Download prices and run the analysis
        run: python run_analysis.py --refresh

      - name: Commit refreshed results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data results figures README.md
          if git diff --cached --quiet; then
            echo "Nothing changed."
          else
            git commit -m "Update prices and results through $(date -u +%Y-%m-%d)"
            git push
          fi
